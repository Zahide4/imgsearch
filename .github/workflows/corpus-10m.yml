name: 10M corpus (standalone, no storage)

# The 10M build. Each runner crawls Commons, embeds with SigLIP on its own
# CPU, scores for safety, and upserts straight to Qdrant. Nothing is parked
# anywhere in between, so this needs no bucket, no HuggingFace repo, no egress
# allowance and no payment method.
#
# Measured on this hardware (4 vCPU, AMD EPYC 7763):
#
#   crawl only          5.4 img/s per runner
#   SigLIP forward      4.8 img/s per runner at 2 threads (4.2 at four)
#   coupled             4.6 img/s overlapped, 2.5 img/s if nothing overlaps
#
#   10M on 20 runners   30 h overlapped, 56 h worst case
#
# The browser is served Wikimedia's own 384px thumbnail, which every row
# already carries as `thumb_origin` -- the API generated it during the crawl.
# Storing a second copy was costing 229 GB to duplicate a better CDN.
#
# RESUMING: re-run with the same `build`. Each worker reads its cursor from
# Qdrant, counts what it has already indexed, and continues. A job that hits
# the 6-hour ceiling loses nothing. Expect roughly six runs for the full 10M.

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build identifier; reuse the same value to resume
        default: commons-10m
        required: true
      target_per_worker:
        description: >-
          CUMULATIVE images per worker, not per run. 500000 x 20 = 10M; a
          worker that already has that many exits immediately.
        default: '500000'
        required: true
      max_seconds:
        description: Wall clock per job, under the 6 h runner ceiling
        default: '16200'
        required: true
      workers:
        description: >-
          How many parallel crawlers. Must match the account's Actions
          concurrency: 20 on Free, 40 on Pro, 60 on Team. Changing it
          reshuffles range assignment AND invalidates every saved cursor,
          because the checkpoint key contains the worker count -- so pick a
          number and keep it for the whole build.
        default: '20'
        required: true

permissions:
  contents: read

concurrency:
  group: corpus-10m
  cancel-in-progress: false

jobs:
  # A matrix cannot be written directly from an input, so build it here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          python3 -c "import json;print('matrix='+json.dumps(list(range(${{ inputs.workers }}))))" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # No max-parallel: GitHub already caps this at the account's concurrency
      # limit, so the workflow naturally uses whatever the plan allows -- 20 on
      # Free, 40 on Pro. Each runner has its own IP, which is the point: the
      # per-host rate limit applies per address, so this is N polite crawlers
      # rather than one impolite one.
      matrix:
        worker: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      # Only to authenticate the SigLIP weight download. Twenty runners
      # pulling 600 MB from the Hub at once unauthenticated is exactly the
      # shape of request that gets rate-limited. Nothing is written to HF:
      # --no-archive means there is no repo and no commit.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION || 'images-v2' }}
      # Not 's3'. storage.enabled() is then false and upload_batch no-ops, so
      # no credential can lead to an accidental upload from this workflow.
      STORAGE_BACKEND: none
      CRAWL_UA: ImgSearch/0.2 (https://github.com/Zahide4/imgsearch)
      PYTHONUNBUFFERED: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU embedding runtime
        run: |
          # torchvision must come from the same index as torch: open_clip
          # imports it, and a PyPI (CUDA) build against a cpu-index torch
          # fails with "operator torchvision::nms does not exist".
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # fastembed is not optional: sparse.py builds the BM25 half of
          # hybrid retrieval client-side, because a self-hosted Qdrant has no
          # inference service to do it.
          pip install -q open_clip_torch==3.3.0 httpx Pillow numpy \
            sentencepiece protobuf transformers huggingface_hub \
            qdrant-client fastembed
      - name: Crawl, embed, score and index
        env:
          TARGET: ${{ inputs.target_per_worker }}
          BUILD: ${{ inputs.build }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          WORKER: ${{ matrix.worker }}
          WORKERS: ${{ inputs.workers }}
        run: |
          set +e
          python cloud_corpus.py --no-archive \
            --worker "$WORKER" --workers "$WORKERS" \
            --target "$TARGET" --build "$BUILD" \
            --threads 2 --max-seconds "$MAX_SECONDS"
          code=$?
          set -e
          # 75 (EX_TEMPFAIL) means the worker ran its window, saved its cursor,
          # and has more to do. That is the normal ending for most jobs in a
          # multi-run build -- treat it as a note so a red job always means
          # something actually broke.
          if [ "$code" = "75" ]; then
            echo "::notice title=Resume needed::Worker $WORKER saved its cursor; rerun this build to continue"
            exit 0
          fi
          exit "$code"
