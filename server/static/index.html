<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>imgsearch</title>
<link rel="preconnect" href="https://wsrv.nl" crossorigin>
<style>
  :root{
    --bg:#0d0d10; --panel:#17171c; --panel2:#1e1e25; --line:#2a2a33;
    --fg:#eceef2; --muted:#8b8f9a; --accent:#5b8dff; --ok:#3ec98a; --warn:#e8b84b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 20px 80px}

  .bar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 78%,transparent);
       padding:12px 0 18px}
  .searchbox{display:flex;align-items:center;gap:14px;background:var(--panel);
       border:1px solid var(--line);border-radius:14px;padding:0 18px;
       box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .searchbox:focus-within{border-color:var(--accent)}
  .searchbox svg{flex:none;opacity:.45}
  #q{flex:1;background:none;border:0;outline:0;color:var(--fg);
     font-size:21px;padding:17px 0;font-weight:420}
  #q::placeholder{color:#5b5f6b}
  .lat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;flex:none}
  .lat b{color:var(--ok);font-weight:600}

  .meta{display:flex;gap:16px;align-items:center;margin-top:11px;
        font-size:12px;color:var(--muted);flex-wrap:wrap}
  .meta label{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;
        padding:4px 11px;cursor:pointer;color:var(--muted)}
  .chip:hover{color:var(--fg);border-color:#3a3a45}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);
        border-radius:11px;overflow:hidden;cursor:grab;aspect-ratio:1;
        transition:transform .09s ease,border-color .09s ease}
  .card:hover{transform:translateY(-2px);border-color:#454552}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,141,255,.3)}
  .card img{width:100%;height:100%;object-fit:cover;display:block;
      opacity:0;transition:opacity .18s ease;

            background:var(--panel2)}
  .card img.ready{opacity:1}
  .card::after{content:'';position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.045) 40%,transparent 60%);
      background-size:220% 100%;animation:sk 1.4s ease-in-out infinite;opacity:1;transition:opacity .2s}
  .card.done::after{opacity:0;animation:none}
  @keyframes sk{0%{background-position:130% 0}100%{background-position:-30% 0}}
  .card.busy::before{content:'';position:absolute;z-index:3;inset:0;
      background:rgba(0,0,0,.55);backdrop-filter:blur(1px)}
  .card .prog{position:absolute;z-index:4;inset:0;display:none;
      align-items:center;justify-content:center;flex-direction:column;gap:8px;
      font-size:11px;color:var(--fg);letter-spacing:.02em}
  .card.busy .prog,.card.copied .prog{display:flex}
  .card .ring{width:30px;height:30px;border-radius:50%;
      border:2.5px solid rgba(255,255,255,.18);border-top-color:var(--accent);
      animation:spin .7s linear infinite}
  .card.copied::before{content:'';position:absolute;z-index:3;inset:0;
      background:rgba(11,40,25,.62)}
  .card.copied .ring{animation:none;border:none;width:auto;height:auto;
      font-size:22px;color:var(--ok)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .card .info{position:absolute;inset:auto 0 0 0;padding:22px 10px 8px;
      background:linear-gradient(transparent,rgba(0,0,0,.93));
      opacity:0;transition:opacity .12s}
  .card:hover .info,.card.sel .info{opacity:1}
  .card .t{font-size:11px;line-height:1.35;max-height:2.7em;overflow:hidden;
           margin-bottom:4px}
  .card .l{font-size:10px;color:var(--ok);font-weight:600;letter-spacing:.02em}
  .card .l.sa{color:var(--warn)}
  .card .dim{position:absolute;top:7px;right:8px;font-size:10px;
      background:rgba(0,0,0,.7);padding:2px 6px;border-radius:5px;
      color:var(--muted);opacity:0;transition:opacity .12s}
  .card:hover .dim{opacity:1}

  .empty{text-align:center;padding:90px 20px;color:var(--muted)}
  .empty h2{color:var(--fg);font-weight:500;font-size:17px;margin:0 0 8px}
  .empty code{background:var(--panel2);padding:2px 7px;border-radius:5px;
              font-size:12px;color:var(--accent)}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);
     background:var(--panel2);border:1px solid var(--line);padding:11px 20px;
     border-radius:11px;transition:transform .22s cubic-bezier(.2,.9,.3,1.2);
     box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:13px;z-index:50}
  .toast.on{transform:translateX(-50%) translateY(0)}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;
      border-radius:5px;padding:1px 6px;font:11px ui-monospace,monospace}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="searchbox">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/>
           <path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search anything&hellip;" autocomplete="off"
             spellcheck="false" autofocus>
      <span class="lat" id="lat"></span>
    </div>
    <div class="meta">
      <span id="corpus">&mdash;</span>
      <label><input type="checkbox" id="commercial" checked> hide share-alike (CC BY-SA)</label>
      <span style="flex:1"></span>
      <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp;
            <kbd>&crarr;</kbd> copy &nbsp; drag to Photoshop/Premiere</span>
    </div>
    <div class="meta" id="examples"></div>
  </div>

  <div id="out"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $  = s => document.querySelector(s);
const qEl = $('#q'), outEl = $('#out'), latEl = $('#lat');
let results = [], sel = -1, ctrl = null, timer = null, generation = 0;
let warmCtl = null;

// The origin image URL is the `url` parameter we passed to the proxy.
// Module scope on purpose: both render() and copyImage() need it.
const originOf = t => { try { return new URL(t, location.href).searchParams.get('url') || ''; }
                        catch (e) { return ''; } };

const EXAMPLES = ["v12 engine cutaway","human heart anatomy","brushed metal texture",
  "misty forest at dawn","vintage typewriter","art deco poster","circuit board macro",
  "storm clouds over desert","medieval castle ruins","microscope diatoms"];

$('#examples').innerHTML = EXAMPLES.map(e =>
  `<span class="chip" onclick="go('${e}')">${e}</span>`).join('');

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1600);
}
function go(q){ qEl.value = q; run(); }

fetch('/api/stats').then(r=>r.json()).then(d=>{
  $('#corpus').textContent = d.total
    ? d.total.toLocaleString() + ' images indexed'
    : 'empty index';
  if(!d.total) outEl.innerHTML = `<div class="empty">
    <h2>No index yet</h2>
    <p>The image index is being prepared. Please try again shortly.</p></div>`;
});

const DEBOUNCE_MS = 320, MIN_CHARS = 2;
const rcache = new Map();
const cacheKey = q => JSON.stringify([q, $('#commercial').checked]);
function cancelSearch(){
  clearTimeout(timer); generation++;
  if(ctrl) ctrl.abort();
  ctrl = null;
}
function cached(q){
  const item = rcache.get(cacheKey(q));
  if(!item || Date.now()-item.at > 120000) return false;
  results=item.results; sel=-1; render();
  latEl.innerHTML='<b>0ms</b> &nbsp;cached'; return true;
}
qEl.addEventListener('input', () => {
  cancelSearch();
  const q=qEl.value.trim();
  if(q.length < MIN_CHARS){ results=[]; sel=-1; outEl.innerHTML=''; latEl.textContent=''; return; }
  if(cached(q)) return;
  latEl.textContent='searching…';
  timer=setTimeout(run, DEBOUNCE_MS);
});
async function run(){
  cancelSearch();
  const current=generation, q=qEl.value.trim(), key=cacheKey(q);
  if(q.length < MIN_CHARS){ results=[]; sel=-1; outEl.innerHTML=''; latEl.textContent=''; return; }
  if(cached(q)) return;
  ctrl=new AbortController();
  latEl.textContent='searching…';
  const t0=performance.now();
  try{
    const r=await fetch(`/api/search?q=${encodeURIComponent(q)}&limit=60`
      + ($('#commercial').checked ? '&license_class=public_domain,attribution' : ''), {signal:ctrl.signal});
    if(!r.ok) throw new Error('Search unavailable. Please try again.');
    const d=await r.json();
    if(current !== generation) return;
    if(!Array.isArray(d.results)) throw new Error('Invalid search response');
    results=d.results; sel=-1;
    rcache.set(key,{at:Date.now(),results});
    if(rcache.size>150) rcache.delete(rcache.keys().next().value);
    latEl.innerHTML=`<b>${Math.round(performance.now()-t0)}ms</b> &nbsp;server ${d.ms}ms`;
    render();
  }catch(e){
    if(e.name!=='AbortError' && current===generation){
      latEl.textContent=e.message;
    }
  }
}

function render(){
  if(!results.length){
    outEl.innerHTML = `<div class="empty"><h2>Nothing found</h2>
      <p>Small corpus &mdash; that is the signal you are testing for.</p></div>`;
    return;
  }
  outEl.innerHTML = `<div class="grid">` + results.map((r,i)=>{
    const sa = r.license_class === 'share_alike';
    return `<div class="card" data-i="${i}" draggable="true">
      <img src="${esc(r.thumb)}" loading="${i<12?'eager':'lazy'}" fetchpriority="${i<4?'high':'auto'}" decoding="async" alt="${esc(r.title)}" referrerpolicy="no-referrer">
      <span class="dim">${r.width}&times;${r.height}</span>
      <div class="prog"><div class="ring"></div><span class="ptxt"></span></div>
      <div class="info">
        <div class="t">${esc(r.title)}</div>
        <div class="l ${sa?'sa':''}">${esc(r.license)} &middot; ${r.score}</div>
      </div></div>`;
  }).join('') + `</div>`;

  // Warm the rows just below the fold.
  //
  // Measured: a thumbnail nobody has requested before takes 624ms median
  // (p90 2.1s) because the proxy must fetch the original and resize it;
  // the same image is 293ms once cached. Slow origins dominate the tail --
  // museum servers run 2.2-2.5s cold against Wikimedia's 660ms.
  //
  // Lazy loading means rows 2+ are not even requested until you scroll, so
  // every scroll pays that cold cost live. Fetching them at low priority
  // while you look at row 1 turns most of those into warm hits. Capped, and
  // cancelled when the query changes, so it never competes with the visible
  // grid or a newer search.
  if (warmCtl) warmCtl.abort();
  warmCtl = new AbortController();
  const warmUrls = results.slice(0, 30).map(r => r.thumb);
  (async () => {
    for (const u of warmUrls) {
      try { await fetch(u, {signal: warmCtl.signal, priority: 'low', mode: 'no-cors'}); }
      catch (e) { if (e.name === 'AbortError') return; }
    }
  })();

  outEl.querySelectorAll('.card').forEach(c=>{
    const i = +c.dataset.i;
    // Thumbnail recovery chain.
    //
    // wsrv.nl is a shared free proxy, so Flickr and Wikimedia rate-limit ITS
    // IPs, not ours. It then reports that upstream 429 back to us as a 404.
    // Measured on a 60-result page: 6 broken, and all 6 origins returned 200
    // when fetched directly. So the image is fine; the proxy was throttled.
    //
    // 1. retry the proxy once -- 429s are transient and wsrv caches successes,
    //    so the second attempt usually lands
    // 2. fall back to the origin URL, which is not rate-limited for us
    // 3. only then mark it unavailable
    const img = c.querySelector('img');
    img.dataset.stage = '0';
    // Reveal only once the bytes actually decode. Until then the card is a
    // skeleton, so a failed first attempt never renders as a broken-image
    // icon with alt text -- the retry and origin fallback happen behind the
    // placeholder and the image simply fades in when one of them lands.
    // alt stays on the element for screen readers.
    const reveal = () => { img.classList.add('ready'); c.classList.add('done'); };
    if (img.complete && img.naturalWidth) reveal();
    img.onload = reveal;
    img.onerror = () => {
      const r = results[i], stage = img.dataset.stage;
      if (stage === '0') {
        img.dataset.stage = '1';
        setTimeout(() => { img.src = r.thumb + '&_r=1'; }, 400);
      } else if (stage === '1' && originOf(r.thumb)) {
        // NOT r.full_url -- that is the Flickr/Wikimedia landing PAGE and
        // returns text/html (verified: magic bytes 3c21444f = "<!DO").
        // Setting it as img.src swaps a broken image for a 500KB HTML doc.
        // The real image URL is the one we handed the proxy.
        // The origin is full resolution -- measured avg 1,142 KB against a
        // 22 KB proxied thumbnail. Six of those on a page turns ~1.3 MB of
        // thumbnails into ~8 MB and visibly slows the whole grid, because
        // they compete for bandwidth AND cost a full-size JPEG decode.
        // So recover them, but never at the expense of the images that
        // already work: lowest priority, and skipped entirely while
        // off-screen. The grid paints at full speed; these trickle in.
        img.dataset.stage = '2';
        img.loading = 'lazy';
        img.fetchPriority = 'low';
        img.src = originOf(r.thumb);
      } else {
        c.classList.add('done');            // stop the shimmer
        c.style.opacity = '.4';
        img.remove();                       // no broken icon, no alt text
        c.title = 'Thumbnail unavailable (image proxy was rate-limited)';
      }
    };
    c.onclick = () => { sel = i; mark(); copyImage(results[i]); };
    c.ondragstart = e => {
      const r = results[i];
      const name = (r.title || 'image').replace(/[^\w.-]/g,'_').slice(0,60) + '.webp';
      const url = new URL(r.thumb, location.href).href;
      // DownloadURL is what makes a drop into Finder / Premiere produce a real file
      e.dataTransfer.setData('DownloadURL', `image/webp:${name}:${url}`);
      e.dataTransfer.setData('text/uri-list', r.full_url || r.source_url || url);
      e.dataTransfer.setData('text/plain', r.full_url || r.source_url || url);
      e.dataTransfer.effectAllowed = 'copy';
    };
  });
}

function mark(){
  outEl.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('sel', +c.dataset.i === sel));
  const el = outEl.querySelector('.card.sel');
  if(el) el.scrollIntoView({block:'nearest', behavior:'smooth'});
}

async function copyImage(r){
  const idx = results.indexOf(r);
  const card = outEl.querySelector(`.card[data-i="${idx}"]`);
  const setState = (cls, txt) => {
    if(!card) return;
    card.classList.remove('busy','copied');
    if(cls) card.classList.add(cls);
    const t = card.querySelector('.ptxt'); if(t) t.textContent = txt || '';
    const ring = card.querySelector('.ring');
    if(ring) ring.textContent = cls === 'copied' ? '\u2713' : '';
  };

  // Copy the FULL-RESOLUTION original, not the 384px grid thumbnail.
  // A 384px copy is fine for a mood board and useless in Premiere or
  // Photoshop, which is who this is for. Full-res costs seconds and several
  // MB, so the card shows progress instead of appearing frozen.
  const el = card && card.querySelector('img');
  const full = originOf(r.thumb) || (el && el.currentSrc) || r.thumb;

  setState('busy','fetching');
  try{
    const resp = await fetch(full);
    if(!resp.ok) throw new Error('unavailable');

    // Stream so the percentage is real, not a fake animation.
    // Not every origin sends content-length -- Wikimedia does, rawpixel does
    // not (chunked). So show a percentage when we can and downloaded size when
    // we cannot, rather than a bar that silently never moves.
    const total = +(resp.headers.get('content-length') || 0);
    let blob;
    if(resp.body && resp.body.getReader){
      const reader = resp.body.getReader();
      const parts = []; let got = 0, last = 0;
      for(;;){
        const {done, value} = await reader.read();
        if(done) break;
        parts.push(value); got += value.length;
        if(got - last > 65536){                       // don't thrash the DOM
          last = got;
          setState('busy', total ? Math.round(got/total*100) + '%'
                                 : (got/1e6).toFixed(1) + ' MB');
        }
      }
      blob = new Blob(parts);
    } else {
      blob = await resp.blob();
    }

    setState('busy','processing');
    const bmp = await createImageBitmap(blob);
    const MAX = 4096;                       // generous for editing, still bounded
    const sc = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width*sc)), h = Math.max(1, Math.round(bmp.height*sc));
    const cv = Object.assign(document.createElement('canvas'), {width:w, height:h});
    cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    const png = await new Promise(res => cv.toBlob(res, 'image/png'));

    await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
    setState('copied','');
    toast(`Copied ${w}\u00d7${h} \u00b7 ${(png.size/1e6).toFixed(1)} MB \u00b7 ${r.license}`);
    setTimeout(() => setState(null,''), 1400);
  }catch(e){
    setState(null,'');
    toast('Copy failed: ' + (e.message || e.name));
  }
}


document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' && document.activeElement !== qEl || e.key === 'ArrowRight' && qEl.selectionStart === qEl.value.length){
    if(results.length){ sel = Math.min(sel+1, results.length-1); mark(); e.preventDefault(); }
  } else if(e.key === 'ArrowLeft' && qEl.selectionStart === 0){
    if(results.length && sel > 0){ sel--; mark(); e.preventDefault(); }
  } else if(e.key === 'Enter' && sel >= 0){
    copyImage(results[sel]);
  } else if(e.key === 'Enter' && document.activeElement === qEl){
    run();
  } else if(e.key === 'Escape'){ qEl.focus(); qEl.select(); }
});

$('#commercial').onchange = run;
const esc = s => (s||'').replace(/[<>&"']/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const strip = s => esc(s).replace(/\s+/g,' ').slice(0,60);
</script>
</body>
</html>
